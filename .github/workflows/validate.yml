name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 11 requiere Node >= 22.13 (usa el builtin `node:sqlite`).
      # Node debe instalarse ANTES que pnpm: el runner trae Node 20 por
      # defecto y cualquier invocación de pnpm previo fallaría.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate JSON structure
        run: pnpm validate:json

      - name: Generate README
        run: pnpm generate

      - name: Check README is up-to-date
        run: git diff --exit-code README.md

      - name: Validate endpoints
        run: pnpm validate -- --automatic
        continue-on-error: true
